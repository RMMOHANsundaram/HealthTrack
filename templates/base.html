<!DOCTYPE html>
<html>

<head>

    <title>HealthTrack</title>

</head>

<body>

    <nav>

        <h2>HealthTrack</h2>

        <a href="{% url 'home' %}">
            Home
        </a>

        {% if user.is_authenticated %}

            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>

            {% if user.is_superuser %}

                <a href="{% url 'analytics_dashboard' %}">
                    Analytics Dashboard
                </a>

            {% endif %}

            <a href="{% url 'logout' %}">
                Logout
            </a>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

            <a href="{% url 'register' %}">
                Register
            </a>

        {% endif %}

    </nav>

    <hr>

    {% block content %}
    {% endblock %}

</body>

</html>
